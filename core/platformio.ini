; NOIR Wallet — bring-up stage
; Board: WeAct STM32F401CCU6 (BlackPill form factor)

[env:blackpill_f401cc]
platform = ststm32
board = blackpill_f401cc
framework = stm32cube
build_flags =
    ; WeAct F401CC boards carry a 25 MHz crystal
    -DHSE_VALUE=25000000
    -Isrc/drivers
    -Isrc/platform
    -Isrc/app
    -Isrc/ui
    -Isrc/crypto
    -Isrc/usb
    -Ilib/trezor-crypto
    -Ilib/tinyusb/src
    -Ilib/tinyusb/src/device
    -Ilib/tinyusb/src/class/hid
    -Ilib/tinyusb/src/common
    -Ilib/tinyusb/src/portable/synopsys/dwc2
    -Ilib/tinyusb/src/osal
    ; trezor-crypto: compile out everything except secp256k1/keccak
    -DUSE_BIP32_25519_CURVES=0
    -DUSE_NEM=0
    -DUSE_CARDANO=0
    -Wall
    -DNDEBUG
lib_ldf_mode = off
; trezor-crypto .c files are compiled via symlinks in src/trezor/ (a single
; source of truth in lib/trezor-crypto/, shared with the host-test Makefile).
build_src_filter = +<*>
monitor_speed = 115200
upload_protocol = dfu
